# Keeps the fork current: merges ProxyShard/ShardBrowser main into the youtube
# branch every 6 hours and starts a build when upstream moved. Conflicts are
# reported in the run summary. Fork workflows stay under our control.
name: yt-sync

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: yt-sync
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: youtube
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/yt-sync.sh

      - name: Start build
        if: steps.merge.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          n=$(( $(gh release list --limit 200 --json tagName -q "[.[] | select(.tagName | startswith(\"yt-v$version-\"))] | length") + 1 ))
          gh workflow run yt-build.yml --ref youtube -f tag="yt-v$version-$n"
